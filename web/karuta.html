<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dr.Meme かるた</title>
    <link rel="stylesheet" href="/karuta/static/css/karuta.css?v=20260816-3">
  </head>
  <body>
    <button id="closeButton" class="close-button" aria-label="解散">×</button>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Dr.Meme かるた</h1>
          <p id="statusLine">接続中...</p>
        </div>
        <div class="top-actions">
          <button id="listButton" class="tool-button" type="button">リスト</button>
          <span id="connectionBadge" class="badge">WS</span>
        </div>
      </header>

      <section id="players" class="players"></section>

      <section class="roundbar">
        <div id="roundLabel" class="round-label">第0戦 / 49</div>
        <div id="penaltyLabel" class="penalty-label"></div>
      </section>

      <section id="board" class="board" aria-label="かるた札"></section>

      <section id="results" class="results" hidden></section>
    </main>

    <dialog id="listDialog" class="dialog">
      <form method="dialog" class="dialog-head">
        <h2>Memelist</h2>
        <button class="tool-button" value="close">閉じる</button>
      </form>
      <div class="search-row">
        <input id="memeSearch" type="search" maxlength="80" placeholder="検索">
        <button id="memeSearchButton" class="tool-button" type="button">検索</button>
      </div>
      <div id="memeRows" class="meme-rows"></div>
      <div class="pager">
        <button id="prevPage" class="tool-button" type="button">前</button>
        <span id="pageLabel">1</span>
        <button id="nextPage" class="tool-button" type="button">次</button>
      </div>
    </dialog>

    <dialog id="confirmDialog" class="dialog small">
      <h2>解散</h2>
      <div class="confirm-actions">
        <button id="disbandButton" class="danger-button" type="button">解散</button>
        <button id="cancelDisbandButton" class="tool-button" type="button">キャンセル</button>
      </div>
    </dialog>

    <dialog id="midgameDialog" class="dialog small">
      <h2>中間確認</h2>
      <p id="midgameText"></p>
      <button id="midgameAckButton" class="primary-button" type="button">OK</button>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script src="/karuta/static/js/karuta.js?v=20260816-3" defer></script>
  </body>
</html>
